global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: mazhixing-backend
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets: ["backend:8000"]
    # 若 backend/.env 设置了 METRICS_TOKEN，取消注释并填入相同 token：
    # authorization:
    #   type: Bearer
    #   credentials: your-metrics-token
