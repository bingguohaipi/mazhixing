# HTTPS 覆盖配置 — 与 docker-compose.prod.yml 一起使用
# docker compose -f docker-compose.prod.yml -f docker-compose.https.yml up -d

services:
  frontend:
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-your-domain.com}
    volumes:
      - ./deploy/certs:/etc/nginx/certs:ro
      - ./deploy/certbot-www:/var/www/certbot:ro
      - ./deploy/nginx.https.conf:/etc/nginx/templates/default.conf.template:ro
    command: >
      /bin/sh -c "envsubst '$$DOMAIN' < /etc/nginx/templates/default.conf.template
      > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
